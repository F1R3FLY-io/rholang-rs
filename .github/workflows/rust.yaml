name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          # gxhash (transitive) compile_error!s on x86_64 without aes+sse2.
          # This action sets RUSTFLAGS itself, which would override any
          # .cargo/config.toml, so the flags have to be supplied here.
          rustflags: "-D warnings -C target-feature=+aes,+sse2"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: build + test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # See the lint job.
          rustflags: "-D warnings -C target-feature=+aes,+sse2"

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace
